<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎃 Ruta de Dulces de Halloween 🍬</title>

  <!-- Tipografía Aesthetic / Gótica moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Hoja de estilos del mapa (Leaflet OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-color: #0b0813;
      --card-bg: rgba(26, 17, 43, 0.75);
      --card-border: rgba(255, 117, 24, 0.35);
      --orange-neon: #ff6e27;
      --purple-neon: #a855f7;
      --green-glow: #39ff14;
      --text-light: #f3f0f7;
      --text-muted: #b8afc8;
      --font-title: 'Creepster', cursive;
      --font-body: 'Outfit', sans-serif;

      /* Ajustes de estilo JerrySystems */
      --js-tamano-texto: 1.2rem;
      --js-tipo-letra: 'Outfit', sans-serif;
      --js-color-texto-general: #00FF00;
      --js-color-destacado: #00FF00;
      --js-color-hover: #00FFFF;
      --js-tamano-logo: 32px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(168, 85, 247, 0.15), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(255, 110, 39, 0.12), transparent 45%),
        linear-gradient(to bottom, #07050a, #120b1e);
      color: var(--text-light);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .spooky-elements {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ghost {
      position: absolute;
      font-size: 2.2rem;
      opacity: 0.18;
      animation: float 14s infinite ease-in-out;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
    }

    @keyframes float {
      0%, 100% { transform: translateY(105vh) rotate(0deg); }
      50% { transform: translateY(-10vh) rotate(20deg); }
    }

    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 1.5rem 1.5rem;
    }

    header h1 {
      font-family: var(--font-title);
      font-size: clamp(2.3rem, 5.5vw, 4rem);
      color: var(--orange-neon);
      text-shadow: 0 0 15px rgba(255, 110, 39, 0.6), 0 0 35px rgba(255, 110, 39, 0.3);
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .badge-counter {
      display: inline-block;
      margin-top: 1rem;
      background: rgba(168, 85, 247, 0.18);
      border: 1px solid var(--purple-neon);
      padding: 0.4rem 1.2rem;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #dfb2ff;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.25);
    }

    .grid-container {
      position: relative;
      z-index: 1;
      max-width: 1250px;
      margin: 2rem auto 5rem;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 2rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                  box-shadow 0.35s ease, 
                  border-color 0.35s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--orange-neon);
      box-shadow: 0 15px 35px rgba(255, 110, 39, 0.25), 0 0 15px rgba(168, 85, 247, 0.2);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 200px;
      overflow: hidden;
      background: #191224;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover img {
      transform: scale(1.08);
    }

    .card-tag {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(11, 8, 19, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.3rem 0.7rem;
      border-radius: 30px;
      backdrop-filter: blur(6px);
    }

    .card-content {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card h3 {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 0.4rem;
      font-weight: 700;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.4;
      margin-bottom: 1rem;
      flex-grow: 1;
    }

    .card-footer-cta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--orange-neon);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 5, 10, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-card {
      background: #140d21;
      border: 1px solid rgba(255, 110, 39, 0.4);
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.25);
      border-radius: 24px;
      width: 100%;
      max-width: 950px;
      max-height: 92vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .modal-close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      font-size: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .modal-close-btn:hover { background: var(--orange-neon); }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      padding: 2rem;
    }

    .modal-media-col {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .modal-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-info-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 1.8rem;
      color: var(--orange-neon);
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .modal-desc {
      color: var(--text-light);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.2rem;
    }

    .modal-notes {
      background: rgba(168, 85, 247, 0.12);
      border-left: 3px solid var(--purple-neon);
      padding: 0.75rem 1rem;
      border-radius: 0 10px 10px 0;
      color: #e5d4ff;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    #map {
      width: 100%;
      height: 240px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 1;
    }

    .btn-maps {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, #ff6e27, #e04f06);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 0.95rem 1.6rem;
      border-radius: 50px;
      box-shadow: 0 8px 25px rgba(255, 110, 39, 0.4);
      margin-top: 1rem;
    }

    .footer-creditos {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2.5rem 1rem 3.5rem;
      margin-top: 2rem;
      border-top: 1px solid rgba(255, 110, 39, 0.2);
      background: linear-gradient(to top, rgba(11, 8, 19, 0.95), transparent);
    }

    .link-autor {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      text-decoration: none;
      font-family: var(--js-tipo-letra);
      font-size: var(--js-tamano-texto);
      color: var(--js-color-texto-general);
      padding: 0.65rem 1.4rem;
      border-radius: 50px;
      background: rgba(26, 17, 43, 0.65);
      border: 1px solid rgba(168, 85, 247, 0.35);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }

    .link-autor .texto-destacado {
      color: var(--js-color-destacado);
      font-weight: 700;
    }

    .link-autor:hover {
      transform: translateY(-3px);
      border-color: var(--js-color-destacado);
      color: var(--js-color-hover);
      box-shadow: 0 0 20px rgba(255, 110, 39, 0.35);
    }

    .logo-autor {
      width: var(--js-tamano-logo);
      height: var(--js-tamano-logo);
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.5);
    }

    .icono-respaldo {
      display: none;
      font-size: var(--js-tamano-logo);
    }

    @media (max-width: 820px) {
      .modal-grid { grid-template-columns: 1fr; padding: 1.5rem; }
      .modal-img { height: 220px; }
      #map { height: 200px; }
    }

    @media (max-width: 600px) {
      .link-autor { flex-wrap: wrap; line-height: 1.4; }
    }
  </style>

  <!-- Bloqueo de inspección y atajos -->
  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && (e.key === 'u' || e.key === 'U')) ||
        (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key))
      ) {
        e.preventDefault();
      }
    });
  </script>
</head>

      const casas = JSON.parse(decodeURIComponent(dataEncoded));

      const gridCasas = document.getElementById('gridCasas');
      const badgeCounter = document.getElementById('totalCasasBadge');
      const modalOverlay = document.getElementById('modalOverlay');
      const btnCerrarModal = document.getElementById('btnCerrarModal');
      const modalImg = document.getElementById('modalImg');
      const modalTitulo = document.getElementById('modalTitulo');
      const modalDescripcion = document.getElementById('modalDescripcion');
      const modalNotas = document.getElementById('modalNotas');
      const btnGoogleMaps = document.getElementById('btnGoogleMaps');

      let leafletMap = null;
      let leafletMarker = null;

      badgeCounter.textContent = `📍 ${casas.length} Casas con Dulces Confirmadas`;

      casas.forEach(casa => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${casa.foto}" alt="${casa.direccion}" loading="lazy">
            <span class="card-tag">Dulces #0${casa.id}</span>
          </div>
          <div class="card-content">
            <h3>${casa.direccion}</h3>
            <p>${casa.referencia}</p>
            <div class="card-footer-cta">
              <span>Ver mapa y ruta</span>
              <span>🎃 &rarr;</span>
            </div>
          </div>
        `;
        card.addEventListener('click', () => abrirDetalle(casa));
        gridCasas.appendChild(card);
      });

      function abrirDetalle(casa) {
        modalImg.src = casa.foto;
        modalImg.alt = casa.direccion;
        modalTitulo.textContent = casa.direccion;
        modalDescripcion.textContent = casa.referencia;
        modalNotas.textContent = casa.notas;

        btnGoogleMaps.href = `https://www.google.com/maps/dir/?api=1&destination=${casa.lat},${casa.lng}&travelmode=walking`;

        modalOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';

        setTimeout(() => {
          if (!leafletMap) {
            leafletMap = L.map('map').setView([casa.lat, casa.lng], 17);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '&copy; OpenStreetMap'
            }).addTo(leafletMap);
            leafletMarker = L.marker([casa.lat, casa.lng]).addTo(leafletMap);
          } else {
            leafletMap.invalidateSize();
            leafletMap.setView([casa.lat, casa.lng], 17);
            leafletMarker.setLatLng([casa.lat, casa.lng]);
          }
          leafletMarker.bindPopup(`<b>${casa.direccion}</b><br>¡Aquí hay dulces! 🍬`).openPopup();
        }, 200);
      }

      function cerrarModal() {
        modalOverlay.classList.remove('active');
        document.body.style.overflow = 'auto';
      }

      btnCerrarModal.addEventListener('click', cerrarModal);
      modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) cerrarModal(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && modalOverlay.classList.contains('active')) cerrarModal();
      });
    })();
  </script>
</body>
</html>
